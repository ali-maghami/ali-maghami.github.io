name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  build:
    name: Build Astro Site
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Restore node_modules
        id: node-modules
        uses: actions/cache@v4
        with:
          path: node_modules
          # Keyed on the lock file, so the cache is only reused for exactly the
          # dependency tree it was built from. A CMS save never touches that
          # file, which is why every content deploy hits this.
          key: node-modules-${{ runner.os }}-node22-${{ hashFiles('package-lock.json') }}

      # setup-node's own cache holds the downloaded tarballs, so npm still had
      # to extract and link 363 packages on every run — two minutes of a
      # two-and-a-half minute deploy, for a site that builds in three seconds.
      # Restoring node_modules skips that entirely; this step only runs when
      # the dependency tree actually changed.
      - name: Install dependencies
        if: steps.node-modules.outputs.cache-hit != 'true'
        run: npm ci

      # Ahead of the build, not after it. The content guards run in about a
      # tenth of a second and name the exact file and path; the Astro build
      # takes minutes to reach the same conclusion, and for an absolute path
      # in a body it never reaches it at all — the page just ships broken.
      #
      # A CMS save commits straight to main, so this is the first moment
      # anything checks it.
      - name: Check content before building
        run: npx vitest run src/lib/content-media.test.ts

      - name: Build with Astro
        run: npm run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    name: Deploy to GitHub Pages
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
