name: CodeQL

# Scans `main` after a merge and weekly, rather than on every pull request.
# This is a static site whose only first-party script is a few lines inline, so
# per-PR scanning cost about a minute on each content edit to re-scan code that
# had not changed. Findings still surface in the Security tab, just after the
# fact rather than as a gate — CodeQL was never a required check here.
on:
  push:
    branches: [main]
  schedule:
    - cron: '23 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (javascript-typescript)
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      packages: read
      actions: read
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
          build-mode: none

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: '/language:javascript-typescript'
