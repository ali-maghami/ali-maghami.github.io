name: Lighthouse CI

# Run on demand against the live Node application. This audit reports scores but
# has no assertions, so it is intentionally not a merge gate.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lighthouse:
    name: Audit build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run Lighthouse CI
        uses: treosh/lighthouse-ci-action@v12
        with:
          configPath: ./lighthouserc.json
          uploadArtifacts: true
          temporaryPublicStorage: true
