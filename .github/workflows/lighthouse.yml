name: Lighthouse CI

# Run on demand only. This audit has no `assert` block in lighthouserc.json, so
# it measures the build without holding it to any threshold — as a required PR
# check it could only ever fail when the build itself failed, which "Build and
# verify" already catches in a third of the time. Kept here so a performance
# question can still be answered on request; add assertions before making it a
# gate again.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lighthouse:
    name: Audit build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build site
        run: npm run build

      - name: Run Lighthouse CI
        uses: treosh/lighthouse-ci-action@v12
        with:
          configPath: ./lighthouserc.json
          uploadArtifacts: true
          temporaryPublicStorage: true
