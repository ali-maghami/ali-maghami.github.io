name: Lighthouse CI

# Weekly and on demand against the live Node application. The budgets in
# lighthouserc.json fail the run when a category score drops below them, so a
# regression in performance or accessibility shows up as a red run rather than
# a number nobody reads. It audits the deployed site, not a pull request, so it
# is not a merge gate.
on:
  schedule:
    - cron: '0 7 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lighthouse:
    name: Audit build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run Lighthouse CI
        uses: treosh/lighthouse-ci-action@v12
        with:
          configPath: ./lighthouserc.json
          uploadArtifacts: true
          temporaryPublicStorage: true
