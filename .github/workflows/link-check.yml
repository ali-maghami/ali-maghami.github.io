name: Link Check

# Weekly and on demand against the running application. Database-backed pages
# do not exist as HTML files in the build artifact, so the previous static-dist
# scan is not applicable to the standalone Node deployment.
on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lychee:
    name: Check links
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check links
        uses: lycheeverse/lychee-action@v2
        with:
          # Two exclusions, for different reasons.
          #
          # LinkedIn answers automated requests with 999, a status of its own
          # invention, whether or not the page exists. Checking it therefore
          # proves nothing: a live profile and a deleted one look identical,
          # so this is excluded rather than added to --accept, which would
          # have dressed up "we cannot tell" as a pass. The profile link is in
          # the header and footer of every page, so it failed the run 16 times
          # over from the moment it was added in the CMS.
          args: >-
            --no-progress
            --accept 200,206,301,302,303,307,308,429
            --max-retries 2
            --exclude '^https://(www\.)?linkedin\.com'
            --exclude '^https://scholar\.google\.'
            'https://maghami.dev/'
          fail: true
