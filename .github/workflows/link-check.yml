name: Link Check

on:
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lychee:
    name: Check links
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build site
        run: npm run build

      - name: Check links
        uses: lycheeverse/lychee-action@v2
        with:
          # Two exclusions, for different reasons.
          #
          # Self-referencing absolute URLs (canonical, og:url) point at the
          # deployed site, so a PR adding a page always 404s on its own new
          # URLs and could never pass. Internal navigation is relative and
          # still checked locally via --root-dir; this only skips refetching
          # production copies of the pages being built here.
          #
          # LinkedIn answers automated requests with 999, a status of its own
          # invention, whether or not the page exists. Checking it therefore
          # proves nothing: a live profile and a deleted one look identical,
          # so this is excluded rather than added to --accept, which would
          # have dressed up "we cannot tell" as a pass. The profile link is in
          # the header and footer of every page, so it failed the run 16 times
          # over from the moment it was added in the CMS.
          args: >-
            --no-progress
            --accept 200,206,301,302,303,307,308,429
            --max-retries 2
            --exclude '^https://ali-maghami\.github\.io'
            --exclude '^https://(www\.)?linkedin\.com'
            --root-dir "${{ github.workspace }}/dist"
            './dist/**/*.html'
          fail: true
