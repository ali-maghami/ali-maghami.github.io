name: Link Check

on:
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lychee:
    name: Check links
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build site
        run: npm run build

      - name: Check links
        uses: lycheeverse/lychee-action@v2
        with:
          # Self-referencing absolute URLs (canonical, og:url) point at the
          # deployed site, so a PR adding a page always 404s on its own new
          # URLs and could never pass. Internal navigation is relative and
          # still checked locally via --root-dir; this only skips refetching
          # production copies of the pages being built here.
          args: >-
            --no-progress
            --accept 200,206,301,302,303,307,308,429
            --max-retries 2
            --exclude '^https://maghamis\.github\.io'
            --root-dir "${{ github.workspace }}/dist"
            './dist/**/*.html'
          fail: true
