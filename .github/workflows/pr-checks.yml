name: Build Checks

# On `main` this exists for code that arrives without a pull request. It is
# skipped for content-only pushes, which a CMS save produces: everything unique
# to this workflow is `astro check` and the unit tests, and neither can be
# broken by markdown. The build itself is not lost either — deploy.yml runs the
# same build, and a bad entry fails it there with the same schema error.
#
# A push is skipped only when every changed file matches, so a save that also
# touches code still runs the full set.
on:
  push:
    branches: [main]
    paths-ignore:
      - 'src/content/**'
      - 'src/data/**'
      - 'src/assets/**'
      - 'public/badges/**'
      - 'docs/**'
      - '**.md'
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    name: Build and verify
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run lint if available
        run: |
          HAS_LINT=$(node -p "Boolean(JSON.parse(require('fs').readFileSync('package.json', 'utf8')).scripts?.lint)")
          if [ "$HAS_LINT" = "true" ]; then
            npm run lint
          else
            echo "No lint script found, skipping."
          fi

      - name: Run tests if available
        run: |
          HAS_TEST=$(node -p "Boolean(JSON.parse(require('fs').readFileSync('package.json', 'utf8')).scripts?.test)")
          if [ "$HAS_TEST" = "true" ]; then
            npm test
          else
            echo "No test script found, skipping."
          fi

      - name: Build site
        run: npm run build
