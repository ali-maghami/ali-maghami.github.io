name: Build Checks

# Also runs on `main` directly, because CMS saves commit there without opening a
# pull request — without this, a save that breaks the schema would be caught
# only by the deploy failing, with nothing naming the cause. This run does the
# same lint, tests and build, so the failure says what is actually wrong.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    name: Build and verify
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run lint if available
        run: |
          HAS_LINT=$(node -p "Boolean(JSON.parse(require('fs').readFileSync('package.json', 'utf8')).scripts?.lint)")
          if [ "$HAS_LINT" = "true" ]; then
            npm run lint
          else
            echo "No lint script found, skipping."
          fi

      - name: Run tests if available
        run: |
          HAS_TEST=$(node -p "Boolean(JSON.parse(require('fs').readFileSync('package.json', 'utf8')).scripts?.test)")
          if [ "$HAS_TEST" = "true" ]; then
            npm test
          else
            echo "No test script found, skipping."
          fi

      - name: Build site
        run: npm run build
