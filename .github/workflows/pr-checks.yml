name: Build Checks

# Runs on `main` after the fact, not as a gate on pull requests. Nothing blocks
# a merge any more: the lint, tests and build run once the code has landed, and
# a failure is a notification to go and fix it rather than a barrier.
#
# The site is protected either way, because deploy.yml publishes only a
# successful build — a broken commit fails there and the live site stays on its
# last good version.
#
# Content-only pushes are skipped, which is what a CMS save produces:
# everything unique to this workflow is `astro check` and the unit tests, and
# neither can be broken by markdown. A push is skipped only when every changed
# file matches, so a save that also touches code still runs the full set.
on:
  push:
    branches: [main]
    # Everything the CMS writes. The media folders have to be listed one by one
    # because a pattern cannot exclude public/admin, which is configuration
    # rather than content — so ADD ANY NEW CMS MEDIA FOLDER HERE, or a save
    # that uploads to it stops counting as content-only and runs the lot.
    paths-ignore:
      - 'src/content/**'
      - 'src/data/**'
      - 'src/assets/**'
      - 'public/badges/**'
      - 'public/portrait/**'
      - 'docs/**'
      - '**.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    name: Build and verify
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run lint if available
        run: |
          HAS_LINT=$(node -p "Boolean(JSON.parse(require('fs').readFileSync('package.json', 'utf8')).scripts?.lint)")
          if [ "$HAS_LINT" = "true" ]; then
            npm run lint
          else
            echo "No lint script found, skipping."
          fi

      - name: Run tests if available
        run: |
          HAS_TEST=$(node -p "Boolean(JSON.parse(require('fs').readFileSync('package.json', 'utf8')).scripts?.test)")
          if [ "$HAS_TEST" = "true" ]; then
            npm test
          else
            echo "No test script found, skipping."
          fi

      - name: Build site
        run: npm run build
