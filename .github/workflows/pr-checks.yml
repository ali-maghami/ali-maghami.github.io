name: Build Checks

# The live site is a standalone Astro Node application on Hetzner. This
# workflow verifies application changes before merge and re-verifies main; it
# does not deploy. Production deployment is an explicit operation from a
# trusted workstation after the PR has merged.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    name: Build and verify
    runs-on: ubuntu-latest

    # The data layer is tested against a real PostgreSQL rather than a mock:
    # the queries, the enum and array columns and the row-to-record mapping
    # are exactly what a mock would have to fake. The tables come from
    # scripts/test-database.sql, which mirrors the CMS migration.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: portfolio
          POSTGRES_DB: portfolio
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # Only the tests read this. The build below still runs without a
      # database credential, as production builds do.
      PORTFOLIO_TEST_DATABASE_URL: postgres://postgres:portfolio@localhost:5432/portfolio

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Restore node_modules
        id: node-modules
        uses: actions/cache@v4
        with:
          path: node_modules
          # Keyed on the lock file so a cache is reused only for the exact
          # dependency tree it was created from.
          key: node-modules-${{ runner.os }}-node22-${{ hashFiles('package-lock.json') }}

      # setup-node's own cache holds the downloaded tarballs, so npm still had
      # to extract and link 363 packages on every run — two minutes of a
      # two-and-a-half minute deploy, for a site that builds in three seconds.
      # Restoring node_modules skips that entirely; this step only runs when
      # the dependency tree actually changed.
      - name: Install dependencies
        if: steps.node-modules.outputs.cache-hit != 'true'
        run: npm ci

      - name: Run lint if available
        run: |
          HAS_LINT=$(node -p "Boolean(JSON.parse(require('fs').readFileSync('package.json', 'utf8')).scripts?.lint)")
          if [ "$HAS_LINT" = "true" ]; then
            npm run lint
          else
            echo "No lint script found, skipping."
          fi

      - name: Create the portfolio tables
        run: psql "$PORTFOLIO_TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -q -f scripts/test-database.sql

      - name: Run tests if available
        run: |
          HAS_TEST=$(node -p "Boolean(JSON.parse(require('fs').readFileSync('package.json', 'utf8')).scripts?.test)")
          if [ "$HAS_TEST" = "true" ]; then
            npm test
          else
            echo "No test script found, skipping."
          fi

      - name: Build site
        run: npm run build

      # The built server, against fixture content, in the Chrome the runner
      # already has. Started and tested in one step so the process is still
      # there when the tests run. See tests/smoke.test.ts for what is checked.
      - name: Smoke-test the built site in a browser
        env:
          SITE_DATABASE_URL: postgres://postgres:portfolio@localhost:5432/portfolio_site
          SMOKE_BASE_URL: http://127.0.0.1:4321
        run: |
          psql "$PORTFOLIO_TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -qc 'CREATE DATABASE portfolio_site'
          psql "$SITE_DATABASE_URL" -v ON_ERROR_STOP=1 -q -f scripts/test-database.sql -f scripts/test-content.sql
          PORTFOLIO_DATABASE_URL="$SITE_DATABASE_URL" HOST=127.0.0.1 PORT=4321 node dist/server/entry.mjs > server.log 2>&1 &
          for attempt in $(seq 1 30); do
            curl -sf "$SMOKE_BASE_URL/healthz" > /dev/null && break
            sleep 1
          done
          curl -sf "$SMOKE_BASE_URL/healthz"
          npx vitest run tests/smoke.test.ts || { echo '--- server log ---'; cat server.log; exit 1; }
