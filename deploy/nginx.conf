server {
    listen 8080;
    listen [::]:8080;
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # The legacy Git-backed CMS remains available only on GitHub Pages during
    # migration. The database-backed replacement will have its own hostname.
    location = /admin {
        return 404;
    }

    location ^~ /admin/ {
        return 404;
    }

    # Astro fingerprints build assets, so these can be cached indefinitely.
    location ^~ /_astro/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Astro emits directory indexes for clean URLs such as /projects/example.
    location / {
        try_files $uri $uri/ =404;
    }
}
