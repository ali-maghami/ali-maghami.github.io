# Sveltia CMS — a browser UI over the markdown in src/content/projects/.
#
# Every field below mirrors the Zod schema in src/content.config.ts. If you
# change one, change the other: a save commits straight to `main`, so a mismatch
# shows up as a failed build that never deploys rather than as a broken site.

backend:
  name: github
  repo: ali-maghami/ali-maghami.github.io
  branch: main
  # GitHub Pages can't run the OAuth token exchange (it needs a client secret),
  # so that one step lives in a Cloudflare Worker. See docs/cms.md.
  base_url: https://sveltia-cms-auth.seyedali-maghami.workers.dev

# No publish_mode, so the CMS uses its simple workflow: Save commits straight to
# `main` and the deploy publishes it. One button, no review step, and no branch
# or pull request per entry.
#
# This depends on `main` not demanding a pull request for every change. With
# that requirement in place the CMS's push is refused and saving fails outright,
# so the two settings have to match.
#
# What still protects the site is that deploy.yml publishes only a successful
# build. A save that breaks the schema fails the build, nothing is deployed, and
# the live site stays on its last good version until the entry is fixed.

# Fallback for collections that set no folder of their own, and the folder the
# asset browser offers by default.
#
# It used to be src/assets/work, whose public path is /src/assets/work — an
# address Astro never serves. Picking any asset from there in the media browser
# wrote that dead path into the entry, which is how a post hero ended up
# pointing at /src/assets/work/coilsense-coilbox.png and failed the build.
#
# public/media is served exactly as uploaded, so a stray pick now yields a URL
# that works rather than one that cannot. Projects still override this with a
# relative path, because Astro's image() helper resolves heroImage against the
# markdown file rather than the site root.
media_folder: public/media
public_folder: /media

# Rename uploads to a plain slug. Off by default, which broke three deploys in
# one evening: a file called "ChatGPT Image Sep 3, 2026, 09_28_37 PM.png" is
# written into markdown percent-encoded, and Astro resolves a body image against
# the filesystem, where the commas are literal. The spaces survived decoding,
# the commas did not, and the build failed with ImageNotFound.
#
# ChatGPT and Gemini both name their exports that way, so this was going to keep
# happening. Slugifying at the point of upload means the awkward name never
# reaches the markdown at all.
# The plural form. `media_library` (singular) is a union across providers and
# requires a `name` to say which one — without it the CMS refuses to start at
# all. `media_libraries.default` names the provider by its key instead, and
# takes nothing but `config`.
media_libraries:
  default:
    config:
      slugify_filename: true
      # Resized and re-encoded as the file is uploaded. public/ is served
      # exactly as it is committed, so nothing downstream will do this — and
      # a single un-resized screenshot arrived at 3MB, served raw on every
      # visit. 1600px is wider than any slot on the site.
      transformations:
        raster_image:
          format: webp
          quality: 82
          width: 1600

collections:
  - name: blog
    label: Posts
    label_singular: Post
    folder: src/content/blog
    create: true
    extension: md
    format: yaml-frontmatter
    slug: '{{slug}}'
    summary: '{{title}}'
    sortable_fields: [pubDate, title]
    # Hero media lives in public/ so the CMS can preview it, and the leading
    # slash is required on a collection-level media_folder or it is read as
    # relative to this collection's folder. Named hero rather than posts:
    # public/posts would have collided with the /posts/ route this section
    # once had; the name still says what the folder holds.
    media_folder: '/public/hero'
    public_folder: '/hero'
    fields:
      - { name: title, label: Title, widget: string, required: true }
      - { name: description, label: Description, widget: text, required: true }
      - {
          name: kind,
          label: Kind,
          widget: string,
          required: false,
          default: Post,
          hint: 'The small label on the card, e.g. Post or Little ideas.',
        }
      - {
          name: pubDate,
          label: Published,
          widget: datetime,
          required: true,
          date_format: 'YYYY-MM-DD',
          time_format: false,
          format: 'YYYY-MM-DD',
          picker_utc: true,
        }
      - {
          name: updatedDate,
          label: Updated,
          widget: datetime,
          required: false,
          date_format: 'YYYY-MM-DD',
          time_format: false,
          format: 'YYYY-MM-DD',
          picker_utc: true,
        }
      - { name: tags, label: Tags, widget: list, required: false, default: [] }
      - {
          name: draft,
          label: Draft,
          widget: boolean,
          required: false,
          default: false,
          hint: 'Drafts stay editable here but are left out of the built site.',
        }
      - {
          name: heroImage,
          label: Hero image,
          widget: image,
          required: false,
          hint: 'Shown across the top of the card, above everything else. Around 1200px wide is plenty — it is served as uploaded, so a larger file is only a larger download.',
        }
      - {
          name: heroVideo,
          label: Hero video,
          widget: file,
          required: false,
          accept: 'video/mp4',
          hint: 'MP4 only, and keep it short. A few megabytes at most — it is served as uploaded. How it starts is set below.',
        }
      - {
          name: heroVideoPlayback,
          label: Hero video playback,
          widget: select,
          default: loop,
          options:
            [
              { label: 'Loop — starts on its own and repeats', value: loop },
              { label: 'Play once — starts on its own, then stops', value: once },
              { label: 'Play by viewer — waits to be pressed', value: viewer },
            ],
          hint: 'A video that starts on its own is muted, because no browser will start one with sound unprompted. On the post card it never shows controls; Play by viewer simply shows the first frame there.',
        }
      - {
          name: body,
          label: Body,
          widget: markdown,
          # Body media needs a URL the browser can fetch. The collection folder
          # above is relative because Astro's image() helper resolves heroImage
          # against the markdown file — but that path is meaningless as a URL,
          # so a raw <video src> built from it 404s. Anything inserted into a
          # body goes to public/ instead, where it is served as uploaded.
          media_folder: '/public/media',
          public_folder: '/media',
          hint: "Use the Video button for a clip — it has its own playback and width choices. For an image, put 'hero' at the start of its Alt text to span the full page width, and anything after a colon stays the description: 'hero: The coating rig'.",
        }

  - name: projects
    label: Projects
    label_singular: Project
    folder: src/content/projects
    create: true
    extension: md
    format: yaml-frontmatter
    slug: '{{slug}}'
    # 'utc' matters: these are date-only values, which parse as UTC midnight.
    # Formatted in local time they would show the previous day west of
    # Greenwich, so the list would disagree with the site.
    summary: "{{pubDate | date('YYYY-MM-DD', 'utc')}} — {{title}}"
    # Active and archived listed separately, the way the projects page shows
    # them. `default` makes the grouping active on open, rather than something
    # to pick from a menu each time.
    view_groups:
      groups:
        - name: category
          label: Category
          field: category
      default: category
    sortable_fields: [pubDate, title]
    # The same public folder as every other collection. This used to point at
    # ../../assets/work for Astro's image() helper, which made project media the
    # one kind the site could not serve by URL — and the asset browser offered
    # it for post heroes and bodies, where it could only break. heroImage is a
    # plain public path now, so there is one media system instead of two.
    media_folder: '/public/media'
    public_folder: '/media'
    fields:
      - { name: title, label: Title, widget: string, required: true }
      - {
          name: description,
          label: Description,
          widget: text,
          required: true,
          hint: 'One or two sentences. Shown on the project cards and in search results.',
        }
      - name: stage
        label: Stage
        widget: select
        required: true
        default: research-prototype
        hint: 'How far the work got. Shown on the project page.'
        options:
          - { label: Napkin Sketch, value: napkin-sketch }
          - { label: Research Prototype, value: research-prototype }
          - { label: Piloted, value: piloted }
          - { label: Completed, value: completed }
          - { label: Product, value: product }
      - {
          name: purpose,
          label: What's it for?,
          widget: text,
          required: false,
          hint: 'A sentence or two on the project page, beside the stage and date. Longer than the description, which is the tagline under the title.',
        }
      - {
          name: contributors,
          label: Other contributors,
          widget: list,
          required: false,
          default: [],
          hint: 'Anyone else who worked on it, one name per entry. Your own name is added first automatically.',
        }
      - name: category
        label: Category
        widget: select
        required: true
        default: active
        hint: 'Which section of the projects page it appears under. Active is listed above Archived.'
        options:
          - { label: Active project, value: active }
          - { label: Archived project, value: archived }
      - {
          name: pubDate,
          label: Date,
          widget: datetime,
          required: true,
          date_format: 'YYYY-MM-DD',
          time_format: false,
          format: 'YYYY-MM-DD',
          picker_utc: true,
        }
      - { name: tags, label: Tags, widget: list, required: false, default: [] }
      - {
          name: repoUrl,
          label: Repository URL,
          widget: string,
          required: false,
          pattern: ['^https?://.+', 'Must be a full URL starting with http:// or https://'],
        }
      - {
          name: liveUrl,
          label: Live URL,
          widget: string,
          required: false,
          pattern: ['^https?://.+', 'Must be a full URL starting with http:// or https://'],
        }
      - { name: heroImage, label: Hero image, widget: image, required: false }
      - {
          name: cardColor,
          label: Card colour,
          widget: color,
          required: false,
          default: '#BFE3E0',
          allowInput: true,
          hint: 'Fades out from the top right corner of the card. Stored per project, so it stays the same on every visit.',
        }
      - {
          name: cardColorAlt,
          label: Card second colour,
          widget: color,
          required: false,
          default: '',
          allowInput: true,
          hint: 'Optional. The fade passes through this on its way out, which gives the card two hues instead of one.',
        }
      - {
          name: body,
          label: Body,
          widget: markdown,
          # Body media needs a URL the browser can fetch. The collection folder
          # above is relative because Astro's image() helper resolves heroImage
          # against the markdown file — but that path is meaningless as a URL,
          # so a raw <video src> built from it 404s. Anything inserted into a
          # body goes to public/ instead, where it is served as uploaded.
          media_folder: '/public/media',
          public_folder: '/media',
          hint: "Use the Video button for a clip — it has its own playback and width choices. For an image, put 'hero' at the start of its Alt text to span the full page width, and anything after a colon stays the description: 'hero: The coating rig'.",
        }

  - name: papers
    label: Papers
    label_singular: Paper
    folder: src/content/papers
    # Uploaded PDFs. The leading slash is required on a collection-level media
    # folder, or it is read as relative to this collection's folder. Named pdf
    # rather than papers: public/papers would be served at /papers/, which is
    # already this section's page.
    media_folder: '/public/pdf'
    public_folder: '/pdf'
    create: true
    extension: md
    format: yaml-frontmatter
    slug: '{{slug}}'
    summary: '{{year}} — {{title}}'
    sortable_fields: [year, title]
    fields:
      - { name: title, label: Title, widget: string, required: true }
      - {
          name: authors,
          label: Authors,
          widget: string,
          required: true,
          hint: 'As printed by the venue, in citation order. e.g. Maghami, A., Salehi, M., and Khoshdarregi, M.',
        }
      - {
          name: venue,
          label: Venue,
          widget: string,
          required: true,
          hint: 'Journal, conference, or patent office.',
        }
      - { name: year, label: Year, widget: number, required: true, value_type: int, min: 1900 }
      - name: kind
        label: Type
        widget: select
        required: true
        default: journal
        options:
          - { label: Journal article, value: journal }
          - { label: Conference paper, value: conference }
          - { label: Patent, value: patent }
          - { label: Thesis, value: thesis }
          - { label: Preprint, value: preprint }
      - { name: abstract, label: Abstract, widget: text, required: false }
      - {
          name: doi,
          label: DOI,
          widget: string,
          required: false,
          hint: 'Just the identifier, e.g. 10.1016/j.cirpj.2021.08.005 — the link is built for you.',
        }
      - { name: url, label: Publisher link, widget: string, required: false }
      - {
          name: pdf,
          label: PDF,
          widget: file,
          required: false,
          accept: 'application/pdf',
          hint: 'Upload the paper itself. It appears on the card as a PDF link.',
        }
      - {
          name: citations,
          label: Citation count,
          widget: number,
          required: false,
          value_type: int,
          min: 0,
          hint: 'Optional, and copied from Scholar by hand — nothing updates it automatically.',
        }
      - {
          name: tags,
          label: Tags,
          widget: list,
          required: false,
          default: [],
          hint: 'Shown as bubbles on the card, e.g. Crashworthiness or Finite Element Analysis.',
        }
      - { name: featured, label: Featured, widget: boolean, required: false, default: false }
      - { name: body, label: Notes, widget: markdown, required: false }

  - name: certificates
    label: Certificates
    label_singular: Certificate
    folder: src/content/certificates
    create: true
    extension: md
    format: yaml-frontmatter
    slug: '{{slug}}'
    summary: '{{name}} — {{issuer}}'
    sortable_fields: [issueDate, name]
    # Badges live in public/ rather than src/assets. Files under src/ are never
    # served — Astro emits them under hashed /_astro/ names the CMS cannot
    # predict — so a preview URL pointing there 404s and the editor shows a
    # blank. public/ is served verbatim at the path recorded below, so the
    # preview resolves. The trade is that Astro does not optimise these, which
    # is why the committed files are kept small.
    # The leading slash is required. A collection-level media_folder without
    # one is read as relative to this collection's folder, which sent the CMS
    # looking in src/content/certificates/public/badges and left every badge
    # preview blank. public_folder is the URL the browser fetches.
    media_folder: '/public/badges'
    public_folder: '/badges'
    fields:
      - { name: name, label: Name, widget: string, required: true }
      - { name: issuer, label: Issuer, widget: string, required: true }
      - {
          name: issueDate,
          label: Issued,
          widget: datetime,
          required: true,
          date_format: 'YYYY-MM-DD',
          time_format: false,
          format: 'YYYY-MM-DD',
          picker_utc: true,
        }
      - {
          name: expiryDate,
          label: Expires,
          widget: datetime,
          required: false,
          date_format: 'YYYY-MM-DD',
          time_format: false,
          format: 'YYYY-MM-DD',
          picker_utc: true,
        }
      - { name: credentialId, label: Credential ID, widget: string, required: false }
      - { name: url, label: Verification link, widget: string, required: false }
      - {
          name: badge,
          label: Badge image,
          widget: image,
          required: false,
          hint: 'The issuer badge, square, ideally 125x125. Shown small beside the name.',
        }
      - {
          name: featured,
          label: Show in site footer,
          widget: boolean,
          required: false,
          default: false,
          hint: 'The footer appears on every page, so keep this to a handful. Everything still shows on the certificates page.',
        }
      - { name: body, label: Notes, widget: markdown, required: false }

  - name: pages
    label: Pages
    files:
      - name: home
        label: Home page
        file: src/content/home/index.md
        format: yaml-frontmatter
        # Leading slash required: without one this is read as relative to the
        # entry's folder and uploads land somewhere nothing serves. public/ is
        # used rather than src/assets so the preview here actually resolves.
        media_folder: '/public/portrait'
        public_folder: '/portrait'
        fields:
          - { name: heading, label: Heading, widget: string, required: true }
          - {
              name: portrait,
              label: Portrait,
              widget: image,
              required: false,
              hint: 'Shown as a circle beside the heading. Square works best. Leave empty for a text-only hero.',
            }
          - {
              name: portraitSize,
              label: Portrait size,
              widget: number,
              required: false,
              value_type: int,
              min: 80,
              max: 420,
              default: 250,
              hint: 'Diameter in pixels. Capped at 150 on phones so it cannot crowd the heading.',
            }
          - {
              name: portraitBorderWidth,
              label: Portrait ring thickness,
              widget: number,
              required: false,
              value_type: int,
              min: 0,
              max: 16,
              default: 3,
              hint: 'Pixels. 0 removes the ring.',
            }
          - {
              name: portraitOpacity,
              label: Portrait opacity,
              widget: number,
              required: false,
              value_type: int,
              min: 10,
              max: 100,
              default: 80,
              hint: 'Percent. Lower lets more of the background colour through.'
            }
          - {
              name: portraitBackground,
              label: Portrait background colour,
              widget: color,
              required: false,
              default: '#FFFFFF',
              allowInput: true,
              hint: 'Fill behind the photo, inside the ring. Only visible once the opacity below is above zero.',
            }
          - {
              name: portraitBackgroundOpacity,
              label: Portrait background opacity,
              widget: number,
              required: false,
              value_type: int,
              min: 0,
              max: 100,
              default: 0,
              hint: 'Percent. 0 leaves the background colour off entirely.',
            }
          - {
              name: projectCount,
              label: Projects on the home page,
              widget: number,
              required: false,
              value_type: int,
              min: 1,
              max: 12,
              default: 4,
              hint: 'How many project cards the home page lists, newest first.',
            }
          - {
              name: postCount,
              label: Posts on the home page,
              widget: number,
              required: false,
              value_type: int,
              min: 1,
              max: 12,
              default: 5,
              hint: 'How many post cards the home page lists, newest first.',
            }
          - name: portraitFilter
            label: Portrait filter
            widget: select
            required: false
            default: grayscale
            hint: 'The background colour changes on every page load, so a full-colour photo clashes with some palettes. Greyscale suits all of them.'
            options:
              - { label: Greyscale, value: grayscale }
              - { label: Softened greyscale, value: soft-grayscale }
              - { label: Sepia, value: sepia }
              - { label: Greyscale with more contrast, value: contrast }
              - { label: Full colour, value: none }
          - {
              name: focusAreas,
              label: Focus areas,
              widget: list,
              required: false,
              default: [],
              hint: 'The short list under the intro.',
            }
          - {
              name: body,
              label: Intro,
              widget: markdown,
              required: true,
              hint: 'Links and bold text work here.',
            }

      - name: about
        label: About page
        file: src/content/about/index.md
        format: yaml-frontmatter
        fields:
          - { name: title, label: Title, widget: string, required: true }
          - { name: eyebrow, label: Eyebrow, widget: string, required: false, default: About }
          - { name: standfirst, label: Standfirst, widget: text, required: true }
          - name: skills
            label: Skills & interests
            widget: list
            required: false
            default: []
            fields:
              - { name: area, label: Area, widget: string, required: true }
              - { name: detail, label: Detail, widget: string, required: true }
          - name: education
            label: Education
            widget: list
            required: false
            default: []
            fields:
              - { name: label, label: Qualification, widget: string, required: true }
              - { name: detail, label: Institution and year, widget: string, required: true }
          - { name: body, label: Body, widget: markdown }

  - name: settings
    label: Settings
    files:
      - name: site
        label: Site and social links
        file: src/data/settings.json
        format: json
        fields:
          - { name: siteTitle, label: Site title, widget: string, required: true }
          - { name: siteDescription, label: Site description, widget: text, required: true }
          - name: social
            label: Social links
            widget: object
            fields:
              - {
                  name: github,
                  label: GitHub,
                  widget: string,
                  required: false,
                  hint: 'Full URL. Leave blank to hide the icon.',
                }
              - { name: linkedin, label: LinkedIn, widget: string, required: false }
              - { name: scholar, label: Google Scholar, widget: string, required: false }
              - { name: email, label: Email, widget: string, required: false }
          - name: footerBadges
            label: Certificate badges in the footer
            widget: object
            fields:
              - {
                  name: limit,
                  label: How many badges,
                  widget: number,
                  required: false,
                  value_type: int,
                  min: 0,
                  max: 20,
                  default: 6,
                  hint: 'Most badges to show in the footer strip. 0 shows every certificate marked "Show in site footer".',
                }
              - name: pages
                label: Show on these pages
                widget: select
                multiple: true
                required: false
                default: [home, about, certificates]
                hint: 'Which pages show the badge strip. A section covers its entries, so choosing Projects covers every project page. Only certificates marked "Show in site footer" appear.'
                options:
                  - { label: Home, value: home }
                  - { label: Projects, value: projects }
                  - { label: Posts, value: blog }
                  - { label: Papers, value: papers }
                  - { label: Certificates, value: certificates }
                  - { label: About, value: about }
