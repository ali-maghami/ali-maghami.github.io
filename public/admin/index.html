<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<!-- The editor is a private tool, not a page anyone should find via search. -->
		<meta name="robots" content="noindex, nofollow" />
		<title>Content Manager</title>
	</head>
	<body>
		<!--
			Sveltia CMS reads ./config.yml, talks to the GitHub API directly, and
			commits to a branch. Pinned deliberately: this is a 0.x package loaded
			from a CDN into a public page, so an unpinned URL would let an upstream
			release change what runs here without review. Bump it on purpose.
		-->
		<script src="https://unpkg.com/@sveltia/cms@0.205.0/dist/sveltia-cms.js" type="module"></script>

		<!--
			A Video block for the body editor. The built-in components cover
			images and code, so a body could otherwise only hold a video by
			typing the HTML by hand — the media button filters to images.

			Module scripts run in document order after parsing, so the bundle
			above has already set window.CMS by the time this evaluates; the
			wait is a guard for the case where it has not, rather than the
			expected path.
		-->
		<script type="module">
			const registerVideoBlock = (CMS) => {
				CMS.registerEditorComponent({
					id: 'video',
					label: 'Video',
					icon: 'movie',
					fields: [
						{
							name: 'src',
							label: 'Video file',
							widget: 'file',
							accept: 'video/mp4',
							hint: 'MP4. Readers get play, pause and volume, so it does not start on its own.',
						},
					],
					// Must match what toBlock writes, or an existing video in a
					// body is not recognised when the entry is reopened.
					pattern: /<video src="([^"]+?)" controls playsinline><\/video>/,
					fromBlock: (match) => ({ src: decodeURI(match[1]) }),
					toBlock: (data) => `<video src="${data.src}" controls playsinline></video>`,
					toPreview: (data) => `<video src="${data.src}" controls playsinline></video>`,
				});
			};

			if (window.CMS) {
				registerVideoBlock(window.CMS);
			} else {
				const timer = setInterval(() => {
					if (!window.CMS) return;
					clearInterval(timer);
					registerVideoBlock(window.CMS);
				}, 50);
				setTimeout(() => clearInterval(timer), 10000);
			}
		</script>
	</body>
</html>
