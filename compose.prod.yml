# Runs the public portfolio on the server. Caddy remains the only service with
# host ports; this container is reachable solely through the shared edge
# network and has no access to ContentFlow or its database.
name: portfolio

services:
  web:
    build:
      context: .
      args:
        SITE_URL: ${SITE_URL:-https://maghami.dev}
        GIT_REVISION: ${GIT_REVISION:-unknown}
    container_name: portfolio
    restart: unless-stopped
    env_file: .env.reader
    environment:
      HOST: 0.0.0.0
      PORT: 8080
      UPLOAD_DIR: /app/uploads
    volumes:
      - portfolio_uploads:/app/uploads:ro
    security_opt:
      - no-new-privileges:true
    networks:
      - edge
      - data

volumes:
  portfolio_uploads:
    external: true
    name: portfolio-cms_uploads

networks:
  edge:
    external: true
  data:
    external: true
